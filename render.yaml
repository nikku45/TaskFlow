services:
  # 1. Express API Web Service (Free Tier)
  - type: web
    name: taskflow-api
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps --include=dev && npx prisma@5.22.0 generate && npm run build
    startCommand: npx prisma@5.22.0 migrate deploy && node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_BASE_PATH
        value: /api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: taskflow-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: BCRYPT_COST_FACTOR
        value: "12"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: TaskFlow Notification

  # 2. Background Queue Worker Service (Free Web Service Tier)
  - type: web
    name: taskflow-worker
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps --include=dev && npx prisma@5.22.0 generate && npm run build
    startCommand: node dist/workers/email.worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: taskflow-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        fromService:
          type: web
          name: taskflow-api
          envVarKey: JWT_ACCESS_SECRET
      - key: JWT_REFRESH_SECRET
        fromService:
          type: web
          name: taskflow-api
          envVarKey: JWT_REFRESH_SECRET
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: TaskFlow Notification

  # 3. Redis Service
  - type: redis
    name: taskflow-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  # 4. PostgreSQL Database (Free Tier)
  - name: taskflow-postgres
    databaseName: taskflow
    user: taskflow
    plan: free
